<script>

    window.__log.push(s);
    var r = document.getElementById("root");
    if (r) r.innerHTML = window.__log.map(function(l){return "&#10003; " + l;}).join("<br>");
  }
  window.onerror = function (msg, src, line, col, err) {
    var r = document.getElementById("root");
    if (r) r.innerHTML = window.__log.map(function(l){return "&#10003; " + l;}).join("<br>") +
      "<pre style='margin-top:16px;padding:12px;color:#B5493B;background:#fff0ee;font-family:monospace;white-space:pre-wrap;border:1px solid #B5493B;'>" +
      "ERROR:\n" + msg + "\nLine " + line + ", Col " + col +
      (err && err.stack ? "\n\n" + err.stack : "") + "</pre>";
    return true;
  };
</script>

<script type="text/jsx-source" id="app-source">
const { useState, useRef, useCallback, useEffect } = React;

// Full 0-100 list, Urdu script + Roman Urdu (user-supplied, verified source).
const NUMBERS = [
  [0, "صفر", "sifar"], [1, "ایک", "aik"], [2, "دو", "do"],
  [3, "تین", "teen"], [4, "چار", "chaar"], [5, "پانچ", "paanch"],
  [6, "چھ", "chheh"], [7, "سات", "saat"], [8, "آٹھ", "aath"],
  [9, "نو", "nau"], [10, "دس", "das"], [11, "گیارہ", "gyaarah"],
  [12, "بارہ", "baarah"], [13, "تیرہ", "terah"], [14, "چودہ", "chaudah"],
  [15, "پندرہ", "pandrah"], [16, "سولہ", "solah"], [17, "سترہ", "satrah"],
  [18, "اٹھارہ", "athaarah"], [19, "انیس", "unnees"], [20, "بیس", "bees"],
  [21, "اکیس", "ikkees"], [22, "بائیس", "baaees"], [23, "تئیس", "teis"],
  [24, "چوبیس", "chaubees"], [25, "پچیس", "pachchees"], [26, "چھبیس", "chhabbees"],
  [27, "ستائیس", "sattaais"], [28, "اٹھائیس", "athaaees"], [29, "انتیس", "untees"],
  [30, "تیس", "tees"], [31, "اکتیس", "iktees"], [32, "بتیس", "battees"],
  [33, "تینتیس", "tentees"], [34, "چونتیس", "chauntees"], [35, "پینتیس", "paintees"],
  [36, "چھتیس", "chhattees"], [37, "سینتیس", "saintees"], [38, "اڑتیس", "artees"],
  [39, "انتالیس", "untalees"], [40, "چالیس", "chaalees"], [41, "اکتالیس", "iktaalees"],
  [42, "بیالیس", "bayaalees"], [43, "تینتالیس", "taintaalees"], [44, "چوالیس", "chawaalees"],
  [45, "پینتالیس", "paintaalees"], [46, "چھیالیس", "chhiyaalees"], [47, "سینتالیس", "saintaalees"],
  [48, "اڑتالیس", "artaalees"], [49, "انچاس", "unchaas"], [50, "پچاس", "pachaas"],
  [51, "اکیاون", "ikyaawan"], [52, "باون", "baawan"], [53, "ترپن", "tirpan"],
  [54, "چوّن", "chauwan"], [55, "پچپن", "pachpan"], [56, "چھپن", "chhappan"],
  [57, "ستاون", "sataawan"], [58, "اٹھاون", "athaawan"], [59, "انسٹھ", "unsath"],
  [60, "ساٹھ", "saath"], [61, "اکسٹھ", "iksath"], [62, "باسٹھ", "baasath"],
  [63, "تریسٹھ", "tirsath"], [64, "چونسٹھ", "chaunsath"], [65, "پینسٹھ", "painsath"],
  [66, "چھیاسٹھ", "chhiyaasath"], [67, "سڑسٹھ", "sarsath"], [68, "اڑسٹھ", "arsath"],
  [69, "انہتر", "unhattar"], [70, "ستر", "sattar"], [71, "اکہتر", "ikhattar"],
  [72, "بہتر", "bahattar"], [73, "تہتر", "tehattar"], [74, "چوہتر", "chauhattar"],
  [75, "پچہتر", "pachhattar"], [76, "چھہتر", "chhihattar"], [77, "ستتر", "sattattar"],
  [78, "اٹھتر", "athhattar"], [79, "اناسی", "unaasi"], [80, "اسی", "assi"],
  [81, "اکیاسی", "ikyaasi"], [82, "بیاسی", "bayaasi"], [83, "تراسی", "tiraasi"],
  [84, "چوراسی", "chauraasi"], [85, "پچاسی", "pachaasi"], [86, "چھیاسی", "chhiyaasi"],
  [87, "ستاسی", "sataasi"], [88, "اٹھاسی", "athaasi"], [89, "نواسی", "navaasi"],
  [90, "نوے", "navve"], [91, "اکانوے", "ikaanave"], [92, "بانوے", "baanave"],
  [93, "ترانوے", "tiraanave"], [94, "چورانوے", "chauraanave"], [95, "پچانوے", "pachaanave"],
  [96, "چھیانوے", "chhiyaanave"], [97, "ستانوے", "sataanave"], [98, "اٹھانوے", "athaanave"],
  [99, "ننانوے", "ninyanave"], [100, "ایک سو", "aik sau"],
];

const LEVELS = {
  easy: { label: "0–29", filter: (n) => n >= 0 && n <= 29 },
  medium: { label: "30–69", filter: (n) => n >= 30 && n <= 69 },
  hard: { label: "70–100", filter: (n) => n >= 70 && n <= 100 },
};

function normalize(str) {
  return (str || "")
    .toLowerCase()
    .replace(/[\u064B-\u0652\u0670]/g, "")
    .replace(/[^\p{L}\p{N}]/gu, "")
    .trim();
}

// Levenshtein edit distance — lets us accept near-misses from accented or
// imperfect speech recognition instead of requiring an exact match.
function editDistance(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] =
        a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

// Allow 1 edit for short words, 2 for longer ones — tolerant of accent-driven
// mis-transcription without accepting a totally different word.
function fuzzyMatch(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  const maxLen = Math.max(a.length, b.length);
  const threshold = maxLen <= 5 ? 1 : 2;
  return editDistance(a, b) <= threshold;
}

function QuizTab({ tabBar }) {
  const [level, setLevel] = useState("easy");
  const [pool, setPool] = useState([]);
  const [current, setCurrent] = useState(null);
  const [status, setStatus] = useState("idle");
  const [heard, setHeard] = useState("");
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);
  const [asked, setAsked] = useState(0);
  const [mastered, setMastered] = useState(() => new Set());
  const [sttLang, setSttLang] = useState("ur-PK");
  const recognitionRef = useRef(null);
  const supported = useRef(true);
  const timeoutRef = useRef(null);

  const clearListenTimeout = () => {
    if (timeoutRef.current) {
      clearTimeout(timeoutRef.current);
      timeoutRef.current = null;
    }
  };

  const buildPool = useCallback(
    () => NUMBERS.filter(([n]) => LEVELS[level].filter(n)),
    [level]
  );

  const nextQuestion = useCallback((p, masteredSet) => {
    const source = p || pool;
    const activeMastered = masteredSet !== undefined ? masteredSet : mastered;
    let remaining = source.filter(([n]) => !activeMastered.has(n));
    // Whole set cleared — start a fresh round rather than getting stuck.
    if (remaining.length === 0) {
      remaining = source;
      setMastered(new Set());
    }
    const answer = remaining[Math.floor(Math.random() * remaining.length)];
    setCurrent(answer);
    setStatus("idle");
    setHeard("");
  }, [pool, mastered]);

  useEffect(() => {
    const p = buildPool();
    setPool(p);
    setMastered(new Set());
    nextQuestion(p, new Set());
    // eslint-disable-next-line
  }, [level]);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      supported.current = false;
      setStatus("unsupported");
      return;
    }
    const recognition = new SR();
    recognition.lang = sttLang;
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;

    recognition.onresult = (event) => {
      clearListenTimeout();
      const alternatives = Array.from(event.results[0]).map((r) => r.transcript);
      const target = current;
      if (!target) return;
      const wordTargets = [normalize(target[1]), normalize(target[2])];
      const isNumeric = (s) => /^[0-9]+$/.test(s);
      // Only match against the Urdu word / its Roman-Urdu transliteration.
      // A plain digit transcription (e.g. from saying the English number
      // word, which Chrome auto-converts to "35") is never accepted as
      // correct — otherwise the answer key could be said in English to
      // cheat. But it's also not automatically wrong: the recognizer
      // sometimes mishears a genuine Urdu attempt as digits. If every
      // alternative is purely numeric, treat it as inconclusive — ask to
      // retry rather than penalizing a possibly-correct answer.
      const matched = alternatives.some((alt) => {
        const normAlt = normalize(alt);
        return wordTargets.some((t) => fuzzyMatch(normAlt, t));
      });
      const allNumeric = alternatives.every((alt) => isNumeric(normalize(alt)));
      setHeard(alternatives[0]);
      if (matched) {
        setAsked((a) => a + 1);
        setStatus("correct");
        setScore((s) => s + 1);
        setMastered((m) => {
          const next = new Set(m);
          next.add(target[0]);
          return next;
        });
        setStreak((s) => {
          const ns = s + 1;
          setBestStreak((b) => Math.max(b, ns));
          return ns;
        });
      } else if (allNumeric) {
        // Inconclusive — don't count it against score or streak.
        setStatus("inconclusive");
      } else {
        setAsked((a) => a + 1);
        setStatus("wrong");
        setStreak(0);
      }
    };

    recognition.onerror = (event) => {
      clearListenTimeout();
      setHeard(event && event.error ? event.error : "");
      setStatus((s) => (s === "listening" ? "mic-error" : s));
    };

    recognition.onend = () => {
      clearListenTimeout();
      setStatus((s) => (s === "listening" ? "no-match" : s));
    };

    recognitionRef.current = recognition;
    return () => {
      clearListenTimeout();
      recognition.abort();
    };
    // eslint-disable-next-line
  }, [current, sttLang]);

  const startListening = () => {
    if (!supported.current || !recognitionRef.current) return;
    setStatus("listening");
    setHeard("");
    clearListenTimeout();
    timeoutRef.current = setTimeout(() => {
      try {
        recognitionRef.current && recognitionRef.current.stop();
      } catch (e) {}
      setStatus((s) => (s === "listening" ? "no-match" : s));
    }, 6000);
    try {
      recognitionRef.current.start();
    } catch (e) {
      clearListenTimeout();
      setStatus("mic-error");
      setHeard(e && e.message ? e.message : String(e));
    }
  };

  const stopListening = () => {
    clearListenTimeout();
    try {
      recognitionRef.current && recognitionRef.current.stop();
    } catch (e) {}
    setStatus((s) => (s === "listening" ? "idle" : s));
  };

  const resetGame = () => {
    setScore(0);
    setStreak(0);
    setBestStreak(0);
    setAsked(0);
    setMastered(new Set());
    const p = buildPool();
    setPool(p);
    nextQuestion(p, new Set());
  };

  if (!current) return null;

  const insecureContext =
    typeof window !== "undefined" && window.isSecureContext === false;

  const accuracy = asked > 0 ? Math.round((score / asked) * 100) : 0;

  const statusCopy = {
    idle: "Tap the mic and say the number in Urdu",
    listening: "Listening…",
    correct: `Correct — you said "${heard}"`,
    wrong: `Not quite — you said "${heard}", expected ${current[1]} (${current[2]})`,
    "no-match": "Didn't catch that. Try again.",
    inconclusive: `Heard only a number ("${heard}") — couldn't tell if that was Urdu. Try saying it again, a bit more clearly.`,
    unsupported: "Speech recognition isn't supported in this browser. Try Chrome or Edge.",
    "mic-error": heard
      ? `Mic error: ${heard}. Check the microphone permission for this page.`
      : "Mic error. Check the microphone permission for this page.",
  };

  return (
    <div style={styles.page}>
      <div style={styles.card}>
        {tabBar}
        <div style={styles.header}>
          <div>
            <div style={styles.eyebrow}>گنتی بولیں</div>
            <h1 style={styles.title}>Urdu Numbers — Speak</h1>
          </div>
          <div style={styles.statBlock}>
            <Stat label="Score" value={`${score}/${asked}`} />
            <Stat label="Streak" value={streak} accent={streak >= 3} />
            <Stat label="Best" value={bestStreak} />
          </div>
        </div>

        <div style={styles.levelRow}>
          {Object.entries(LEVELS).map(([key, cfg]) => (
            <button
              key={key}
              onClick={() => setLevel(key)}
              style={{ ...styles.levelBtn, ...(level === key ? styles.levelBtnActive : {}) }}
            >
              {cfg.label}
            </button>
          ))}
        </div>

        <div style={styles.numberDisplay}>{current[0]}</div>

        {insecureContext && (
          <div style={styles.warningBox}>
            This page is running in an insecure context. Chrome may block
            microphone access here.
          </div>
        )}

        <div style={styles.langRow}>
          {["ur-PK", "en-US"].map((code) => (
            <button
              key={code}
              onClick={() => setSttLang(code)}
              disabled={status === "listening"}
              style={{ ...styles.langBtn, ...(sttLang === code ? styles.langBtnActive : {}) }}
            >
              {code === "ur-PK" ? "Urdu speech" : "Roman-Urdu speech"}
            </button>
          ))}
        </div>

        <div style={styles.micRow}>
          <button
            onClick={startListening}
            disabled={!supported.current || status === "listening"}
            style={{ ...styles.micBtn, ...(status === "listening" ? styles.micBtnActive : {}) }}
          >
            {status === "listening" ? "● Listening…" : "🎙 Speak"}
          </button>
          {status === "listening" && (
            <button onClick={stopListening} style={styles.stopBtn}>Stop</button>
          )}
        </div>

        <div
          style={{
            ...styles.statusBox,
            borderColor: status === "correct" ? "#5B7F52" : status === "wrong" ? "#B5493B" : "#DDD4C7",
            color: status === "correct" ? "#3F5A38" : status === "wrong" ? "#8A3327" : "#5A5346",
          }}
        >
          {statusCopy[status]}
        </div>

        <div style={styles.footer}>
          <button style={styles.primaryBtn} onClick={() => nextQuestion()}>Next number →</button>
          <button style={styles.resetBtn} onClick={resetGame}>Reset</button>
        </div>

        {asked > 0 && (
          <div style={styles.accuracyRow}>
            Accuracy: {accuracy}% · Mastered {mastered.size}/{pool.length}
          </div>
        )}
      </div>
    </div>
  );
}

function FlashcardsTab({ tabBar }) {
  const [level, setLevel] = useState("easy");
  // Default to always-shown, since that's better for learning mode.
  const [autoReveal, setAutoReveal] = useState(true);
  const [pool, setPool] = useState(() =>
    NUMBERS.filter(([n]) => LEVELS["easy"].filter(n))
  );
  const [order, setOrder] = useState(() => pool.map((_, i) => i));
  const [pos, setPos] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const showAnswer = autoReveal || revealed;

  useEffect(() => {
    const p = NUMBERS.filter(([n]) => LEVELS[level].filter(n));
    setPool(p);
    setOrder(p.map((_, i) => i));
    setPos(0);
    setRevealed(false);
  }, [level]);

  const shuffle = () => {
    setOrder((o) => {
      const arr = [...o];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    });
    setPos(0);
    setRevealed(false);
  };

  const goNext = () => {
    setPos((p) => (order.length ? (p + 1) % order.length : 0));
    // Only hide on advance in test mode — in learning mode the answer
    // should stay visible as you move through cards.
    if (!autoReveal) setRevealed(false);
  };
  const goPrev = () => {
    setPos((p) => (order.length ? (p - 1 + order.length) % order.length : 0));
    if (!autoReveal) setRevealed(false);
  };

  if (pool.length === 0 || order.length === 0) return null;
  const current = pool[order[pos]];
  if (!current) return null;

  return (
    <div style={styles.page}>
      <div style={styles.card}>
        {tabBar}
        <div style={styles.header}>
          <div>
            <div style={styles.eyebrow}>فلیش کارڈز</div>
            <h1 style={styles.title}>Urdu Numbers — Flashcards</h1>
          </div>
          <div style={styles.statBlock}>
            <Stat label="Card" value={`${pos + 1}/${order.length}`} />
          </div>
        </div>

        <div style={styles.levelRow}>
          {Object.entries(LEVELS).map(([key, cfg]) => (
            <button
              key={key}
              onClick={() => setLevel(key)}
              style={{ ...styles.levelBtn, ...(level === key ? styles.levelBtnActive : {}) }}
            >
              {cfg.label}
            </button>
          ))}
        </div>

        <div style={styles.langRow}>
          <button
            onClick={() => setAutoReveal(true)}
            style={{ ...styles.langBtn, ...(autoReveal ? styles.langBtnActive : {}) }}
          >
            Always shown (learning)
          </button>
          <button
            onClick={() => { setAutoReveal(false); setRevealed(false); }}
            style={{ ...styles.langBtn, ...(!autoReveal ? styles.langBtnActive : {}) }}
          >
            Hidden (test myself)
          </button>
        </div>

        <div
          style={styles.flashCard}
          onClick={() => { if (!autoReveal) setRevealed((r) => !r); }}
        >
          <div style={styles.numberDisplay}>{current[0]}</div>
          {showAnswer ? (
            <div style={styles.flashAnswer}>
              <div style={styles.flashUrdu}>{current[1]}</div>
              <div style={styles.flashRoman}>{current[2]}</div>
            </div>
          ) : (
            <div style={styles.flashHint}>Tap the card to reveal</div>
          )}
        </div>

        <div style={styles.flashNav}>
          <button style={styles.resetBtn} onClick={goPrev}>← Prev</button>
          {!autoReveal && (
            <button style={styles.primaryBtn} onClick={() => setRevealed((r) => !r)}>
              {revealed ? "Hide" : "Reveal"}
            </button>
          )}
          <button style={styles.resetBtn} onClick={goNext}>Next →</button>
        </div>

        <div style={styles.flashShuffleRow}>
          <button style={styles.langBtn} onClick={shuffle}>🔀 Shuffle order</button>
        </div>
      </div>
    </div>
  );
}

function Stat({ label, value, accent }) {
  return (
    <div style={styles.stat}>
      <div style={{ ...styles.statValue, color: accent ? "#B5493B" : "#2E2A24" }}>{value}</div>
      <div style={styles.statLabel}>{label}</div>
    </div>
  );
}

  page: { minHeight: "100vh", background: "#EFE9DC", display: "flex", alignItems: "center", justifyContent: "center", padding: "24px", fontFamily: "'Georgia', 'Times New Roman', serif" },
  card: { width: "100%", maxWidth: 480, background: "#FFFFFF", borderRadius: 4, border: "1px solid #DDD4C7", padding: "28px 24px", boxShadow: "0 2px 0 #DDD4C7" },

  title: { fontSize: 22, margin: 0, color: "#2E2A24", fontWeight: 600 },
  statBlock: { display: "flex", gap: 14 },
  stat: { textAlign: "center" },
  statValue: { fontSize: 18, fontWeight: 700, fontFamily: "monospace" },

  levelRow: { display: "flex", gap: 8, marginBottom: 24 },
  levelBtn: { flex: 1, padding: "6px 8px", fontSize: 12, borderRadius: 3, border: "1px solid #DDD4C7", background: "#F7F3EA", color: "#5A5346", cursor: "pointer", fontFamily: "inherit" },

  warningBox: { fontSize: 11, color: "#8A3327", background: "#F5E2DE", border: "1px solid #B5493B", borderRadius: 4, padding: "8px 10px", marginBottom: 14, textAlign: "center" },
  langRow: { display: "flex", gap: 8, justifyContent: "center", marginBottom: 14 },
  langBtn: { padding: "5px 10px", fontSize: 11, borderRadius: 999, border: "1px solid #DDD4C7", background: "#F7F3EA", color: "#8A7F6A", cursor: "pointer", fontFamily: "inherit" },

  flashShuffleRow: { display: "flex", justifyContent: "center" },
};

function App() {
  const [activeTab, setActiveTab] = useState("quiz");
  const tabBar = (
    <div style={styles.tabBarRow}>
      <button
        onClick={() => setActiveTab("flashcards")}
        style={{ ...styles.tabBarBtn, ...(activeTab === "flashcards" ? styles.tabBarBtnActive : {}) }}
      >
        📇 Flashcards
      </button>
      <button
        onClick={() => setActiveTab("quiz")}
        style={{ ...styles.tabBarBtn, ...(activeTab === "quiz" ? styles.tabBarBtnActive : {}) }}
      >
        🎙 Quiz
      </button>
    </div>
  );
  return activeTab === "quiz" ? <QuizTab tabBar={tabBar} /> : <FlashcardsTab tabBar={tabBar} />;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (err) {
  document.getElementById("root").innerHTML =
    (window.__log ? window.__log.map(function(l){return "&#10003; " + l;}).join("<br>") : "") +
    "<pre style='margin-top:16px;padding:12px;color:#B5493B;background:#fff0ee;font-family:monospace;white-space:pre-wrap;border:1px solid #B5493B;'>Render error:\n" +
    err.message + "\n\n" + (err.stack || "") + "</pre>";
}
</script>
<script>
  setStatus("Starting JSX transform (this can take a few seconds on mobile)...");
  try {
    var source = document.getElementById("app-source").textContent;
    setStatus("Source text found, length " + source.length);
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
      filename: "app.jsx",
    }).code;
    setStatus("Transform complete, executing app...");
    var s = document.createElement("script");
    s.textContent = output;
    document.body.appendChild(s);
    setStatus("App script appended. If this is the last line you see, the app script itself did not run or did not render.");
  } catch (err) {
    document.getElementById("root").innerHTML =
      window.__log.map(function(l){return "&#10003; " + l;}).join("<br>") +
      "<pre style='margin-top:16px;padding:12px;color:#B5493B;background:#fff0ee;font-family:monospace;white-space:pre-wrap;border:1px solid #B5493B;'>Babel transform error:\n" +
      err.message + "\n\n" + (err.stack || "") + "</pre>";
  }
</script>
</body>
